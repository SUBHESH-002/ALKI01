<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALKI Companion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Socket.IO from CDN for Day 1 prototyping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>

    <!-- Chat Bubble for Output -->
    <div class="chat-bubble" id="chat-bubble">
        <p id="chat-text">Hello! I am ALKI. I am booting up...</p>
    </div>

    <!-- Character Display Area -->
    <div class="character-viewport">
        <!-- Day 2 (Pivot): Modular Sprite Sheet Paper Doll -->
        <div id="alki-paperdoll">
            <div id="layer-base-head"></div>
            <div id="layer-eyes"></div>
            <div id="layer-mouth"></div>
        </div>
    </div>

    <!-- Chat Input Area (Day 3) -->
    <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Say something to ALKI..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
