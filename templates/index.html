<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALKI Companion</title>
    <meta name="description" content="ALKI — Adaptive Learning Kinetic Intelligence, your AI companion">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Socket.IO from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>

    <!-- Chat Bubble for Output -->
    <div class="chat-bubble" id="chat-bubble">
        <p id="chat-text">Booting ALKI OS [v2.0]...</p>
    </div>

    <!-- Hardware Emulation Container -->
    <div class="hardware-container">
        <div class="screen-bezel">
            <!-- The Frame Buffer (Canvas) -->
            <canvas id="screen" width="300" height="200"></canvas>
            <div class="screen-glare"></div>
        </div>
    </div>

    <!-- Emotion Indicator (debug — shows current mood) -->
    <div class="emotion-badge" id="emotion-badge">STATE: BOOT</div>

    <!-- Chat Input Area -->
    <div class="chat-input-area" id="chat-input-area">
        <input type="text" id="chat-input" placeholder="Enter command..." autocomplete="off">
        <button id="send-btn">Transmit</button>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
