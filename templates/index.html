<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALKI Companion</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Load Socket.IO from CDN for Day 1 prototyping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>

    <!-- Chat Bubble for Output -->
    <div class="chat-bubble" id="chat-bubble">
        <p id="chat-text">Hello! I am ALKI. I am booting up...</p>
    </div>

    <!-- Character Display Area -->
    <div class="character-viewport">
        <!-- For Day 2: We use an actual image that we will swap via Javascript -->
        <img id="alki-character" src="{{ url_for('static', filename='assets/neutral.gif') }}" alt="ALKI Character" style="max-width: 100%; max-height: 100%; object-fit: contain;">
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
